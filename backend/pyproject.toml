[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[project]
name = "doc-intelligence"
version = "0.1.0"
description = "AI-Powered Document Intelligence System"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastapi==0.163.1",
    "uvicorn[standard]==0.54.0",
    "pydantic==2.14.3",
    "pydantic-settings==2.16.3",
    "sqlalchemy==2.1.9",
    "psycopg[binary]==3.3.9",
    "pgvector==0.5.1",
    "alembic==1.20.1",
    "celery[redis]==5.7.0",
    "redis==8.1.0",
    "python-multipart==0.0.34",
    "pyjwt[crypto]==2.15.1",
    "bcrypt==5.0.0",
    "pymupdf==2.1",
    "pytesseract==0.3.13",
    "opencv-python-headless==5.0.0.93",
    "pillow==13.0.0",
    "pandas==3.1.1",
    "openpyxl==3.1.5",
    "xlrd==2.0.2",
    "charset-normalizer==3.5.2",
    "openai==3.52.0",
    "google-genai==3.4.0",
    "tenacity==9.1.4",
    "httpx==0.28.1",
    "python-magic==0.4.27; sys_platform != 'win32'",
    "python-magic-bin==0.4.14; sys_platform == 'win32'",
]

[project.optional-dependencies]
dev = [
    "pytest==9.2.0",
    "pytest-asyncio==1.5.0",
    "pytest-cov==7.1.0",
    "ruff==0.17.5",
    "mypy==2.4.1",
]

[tool.pytest.ini_options]
minversion = "7.0"
addopts = "-ra -q"
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
markers = [
    "unit: Unit tests runnable offline",
    "integration: Integration tests with services",
    "live: Live tests requiring external API keys",
]

[tool.ruff]
line-length = 100
target-version = "py312"
