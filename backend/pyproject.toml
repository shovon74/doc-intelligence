[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[project]
name = "doc-intelligence"
version = "0.1.0"
description = "AI-Powered Document Intelligence System"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.30.0",
    "pydantic>=2.8.0",
    "pydantic-settings>=2.4.0",
    "sqlalchemy>=2.0.30",
    "psycopg[binary]>=3.2.0",
    "pgvector>=0.3.0",
    "alembic>=1.13.0",
    "celery[redis]>=5.4.0",
    "redis>=5.0.0",
    "python-multipart>=0.0.9",
    "pyjwt[crypto]>=2.9.0",
    "passlib[bcrypt]>=1.7.4",
    "bcrypt>=4.0.0",
    "pymupdf>=1.24.0",
    "pytesseract>=0.3.10",
    "opencv-python-headless>=4.10.0",
    "pillow>=10.4.0",
    "pandas>=2.2.0",
    "openpyxl>=3.1.5",
    "xlrd>=2.0.1",
    "charset-normalizer>=3.3.0",
    "openai>=1.40.0",
    "google-genai>=1.0.0",
    "tenacity>=8.5.0",
    "httpx>=0.27.0",
    "python-magic>=0.4.27; sys_platform != 'win32'",
    "python-magic-bin>=0.4.14; sys_platform == 'win32'",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3.0",
    "pytest-asyncio>=0.24.0",
    "pytest-cov>=5.0.0",
    "ruff>=0.5.0",
    "mypy>=1.10.0",
]

[tool.pytest.ini_options]
minversion = "7.0"
addopts = "-ra -q"
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
markers = [
    "unit: Unit tests runnable offline",
    "integration: Integration tests with services",
    "live: Live tests requiring external API keys",
]

[tool.ruff]
line-length = 100
target-version = "py312"
